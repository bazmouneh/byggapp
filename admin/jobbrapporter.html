<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggapp – Jobbrapporter</title><style>body{font:16px system-ui;background:#f1f5f9;color:#172033;margin:0}header{background:#101827;color:white;padding:20px}main{max-width:1080px;margin:auto;padding:20px}.card{background:white;padding:20px;border-radius:14px;margin:15px 0;box-shadow:0 3px 12px #0001}button,a{background:#fbbf24;color:#111827;border:0;padding:10px 14px;border-radius:7px;display:inline-block;text-decoration:none;cursor:pointer}.photo{max-width:190px;max-height:160px;border-radius:6px;margin:5px}p{white-space:pre-wrap}small{color:#64748b}</style><header><b>BYGGAPP – Slutförda arbetsorder</b> <a href="/dashboard">Till adminpanelen</a></header><main><h1>Jobbrapporter från personalen</h1><div id="reports">Hämtar rapporter…</div></main><script>
const token=sessionStorage.getItem('byggapp_token');if(!token)location.replace('/login');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p){const r=await fetch('/api/'+p,{headers:{Authorization:'Bearer '+token}});if(r.status===401){location.replace('/login');throw Error('Logga in igen')}const d=await r.json();if(!r.ok)throw Error(d.error||'Fel');return d}
async function load(){try{const rows=await api('job-reports');document.getElementById('reports').innerHTML=rows.map(x=>`<section class="card"><h2>${safe(x.project_number)} – ${safe(x.title)}</h2><small>${safe(x.full_name||x.email)} · ${new Date(x.completed_at).toLocaleString('sv-SE')} · ${(Number(x.worked_minutes)/60).toFixed(2)} projekttimmar</small><p>${safe(x.description)}</p><button onclick="details(${x.id},this)">Visa material och bilder (${x.photo_count})</button><div class="detail"></div><div style="margin-top:12px"><label>Komplettera med bilder (JPG/PNG/WebP, max 2 MB per bild): <input type="file" accept="image/jpeg,image/png,image/webp" multiple id="files-${x.id}"></label><button onclick="addReportPhotos(${x.id},this)">Ladda upp saknade bilder</button><small class="upload-status"></small></div></section>`).join('')||'<p>Inga slutförda jobb ännu.</p>'}catch(e){document.getElementById('reports').textContent=e.message}}
async function details(id,button){const target=button.parentElement.querySelector('.detail');try{const [materials,photos]=await Promise.all([api('job-reports/'+id+'/materials'),api('job-reports/'+id+'/photos')]);target.innerHTML='<h3>Material på arbetsordern</h3>'+ (materials.map(m=>`<div>${safe(m.name)} – ${safe(m.quantity)} ${safe(m.unit)} ${m.rsk?'(RSK '+safe(m.rsk)+')':''}</div>`).join('')||'Inget material')+'<h3>Bilder</h3>';for(const p of photos){const r=await fetch('/api/job-photos/'+p.id,{headers:{Authorization:'Bearer '+token}});if(!r.ok)continue;const url=URL.createObjectURL(await r.blob());const img=document.createElement('img');img.className='photo';img.alt='Jobbfoto';img.src=url;img.onload=()=>URL.revokeObjectURL(url);target.appendChild(img)}}catch(e){target.textContent=e.message}}
async function addReportPhotos(id,button){
 const parent=button.parentElement,files=Array.from(document.getElementById('files-'+id).files),status=parent.querySelector('.upload-status');
 if(!files.length){status.textContent='Välj bilder först';return}
 button.disabled=true;status.textContent='Laddar upp…';
 try{
  for(const file of files){
   if(file.size>2*1024*1024)throw Error('Bilden är större än 2 MB');
   if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Välj JPG, PNG eller WebP');
   const response=await fetch('/api/job-reports/'+id+'/photos',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':file.type},body:file});
   const data=await response.json();if(!response.ok)throw Error(data.error||'Uppladdning misslyckades');
  }
  status.textContent='Bilderna är sparade. Uppdaterar rapporten…';await load();
 }catch(e){status.textContent='Fel: '+e.message}finally{button.disabled=false}
}
load();</script></html>
