<!doctype html><html lang="sv"><meta charset="utf-8"><link rel="icon" type="image/png" href="/assets/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggapp 360 | Logga in</title><style id="byggapp360-brand-css">.byggapp360-brand{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}.byggapp360-brand img{width:68px;height:68px;object-fit:contain;flex-shrink:0}.byggapp360-brand .byggapp360-word{font-size:23px;font-weight:800;color:#fbbf24;letter-spacing:-.4px}.byggapp360-loginbrand{display:flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:14px}.byggapp360-loginbrand img{width:160px;max-width:100%;height:auto}.byggapp360-loginbrand span{font-weight:800;font-size:24px;color:#fbbf24}@media(max-width:530px){.byggapp360-brand img{width:44px;height:44px}.byggapp360-brand .byggapp360-word{font-size:19px}}</style><style>body{margin:0;background:#101827;color:white;font:16px Arial;min-height:100vh;display:grid;place-items:center}.box{background:#1e293b;padding:32px;border-radius:16px;width:min(360px,85vw)}h1{color:#fbbf24}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:8px;border:1px solid #64748b}button{background:#f59e0b;font-weight:bold;cursor:pointer;border:0}#msg{color:#fecaca}</style><style id="byggapp360-full-logo-style">
.byggapp360-full-logo{display:block;width:205px;max-width:100%;height:auto;object-fit:contain}
.byggapp360-brand,.byggapp360-loginbrand{display:flex;align-items:center;justify-content:center;margin:0;gap:0}
.byggapp360-loginbrand .byggapp360-full-logo{width:270px;max-width:100%;margin:0 auto}
@media(max-width:530px){.byggapp360-brand .byggapp360-full-logo{width:160px}.byggapp360-loginbrand .byggapp360-full-logo{width:225px}}
</style>
<style id="byggapp360-light-theme-v1">
/* Byggapp 360 – ljus design anpassad till originalets mörkblå/orange transparenta logotyp. */
html,body{background:#edf3fa!important;color:#162b40!important}
header{background:#f8fbff!important;color:#162b40!important;border-bottom:1px solid #d7e2ef;box-shadow:0 2px 12px #122e4812!important}
header a:not(.btn),header strong,header b,header div,header span{color:#162b40}
header a{background:#e5eef8!important;color:#162b40!important}
nav{background:#e2ebf5!important;border-bottom:1px solid #d0dfef}
nav button:not(.active){color:#1d354d!important}
nav button:not(.active):hover{background:#cfdff0!important}
main .panel,main .card,.box{background:#ffffff!important;color:#162b40;box-shadow:0 5px 22px #163c6010}
.box{border:1px solid #dbe5f1}
body:has(.box)>.box{width:min(400px,90vw)}
input,select,textarea{background:#fff!important;color:#172b40!important;border-color:#c5d3e2!important}
input::placeholder,textarea::placeholder{color:#6a7d90}
.byggapp360-brand,.byggapp360-loginbrand{background:transparent!important}
.byggapp360-full-logo{filter:none!important}
</style>
<div class="box"><div class="byggapp360-loginbrand"><img class="byggapp360-full-logo" src="/assets/byggapp360-logo.png" alt="Byggapp 360" /></div><p>Personal och administration</p><form id="f"><input id="email" type="email" placeholder="E-post" required autocomplete="username"><input id="password" type="password" placeholder="Lösenord" required autocomplete="current-password"><button>Logga in</button></form><p id="msg"></p></div><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Loggar in...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Fel');sessionStorage.setItem('byggapp_token',d.token);location.replace(d.user.role==='admin'?'/dashboard':'/personal');}catch(err){msg.textContent=err.message}}</script></html>
