<!doctype html><html lang="sv"><meta charset="utf-8"><link rel="icon" type="image/png" href="/assets/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggapp 360 | Logga in</title><style id="byggapp360-brand-css">.byggapp360-brand{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}.byggapp360-brand img{width:68px;height:68px;object-fit:contain;flex-shrink:0}.byggapp360-brand .byggapp360-word{font-size:23px;font-weight:800;color:#fbbf24;letter-spacing:-.4px}.byggapp360-loginbrand{display:flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:14px}.byggapp360-loginbrand img{width:160px;max-width:100%;height:auto}.byggapp360-loginbrand span{font-weight:800;font-size:24px;color:#fbbf24}@media(max-width:530px){.byggapp360-brand img{width:44px;height:44px}.byggapp360-brand .byggapp360-word{font-size:19px}}</style><style>body{margin:0;background:#101827;color:white;font:16px Arial;min-height:100vh;display:grid;place-items:center}.box{background:#1e293b;padding:32px;border-radius:16px;width:min(360px,85vw)}h1{color:#fbbf24}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:8px;border:1px solid #64748b}button{background:#f59e0b;font-weight:bold;cursor:pointer;border:0}#msg{color:#fecaca}</style><div class="box"><div class="byggapp360-loginbrand"><img src="/assets/byggapp360-logo.png" alt="Byggapp 360" /></div><p>Personal och administration</p><form id="f"><input id="email" type="email" placeholder="E-post" required autocomplete="username"><input id="password" type="password" placeholder="Lösenord" required autocomplete="current-password"><button>Logga in</button></form><p id="msg"></p></div><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Loggar in...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Fel');sessionStorage.setItem('byggapp_token',d.token);location.replace(d.user.role==='admin'?'/dashboard':'/personal');}catch(err){msg.textContent=err.message}}</script></html>
