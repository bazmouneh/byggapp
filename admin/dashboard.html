<!doctype html><html lang="sv"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="/assets/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggapp 360 | Administration</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font:15px Arial,sans-serif}header{background:#101827;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header b{font-size:23px;color:#fbbf24}nav{background:#1e293b;display:flex;gap:5px;overflow:auto;padding:10px}nav button{background:transparent;color:white;white-space:nowrap}nav button.active{background:#f59e0b;color:#111827}button{cursor:pointer;border:0;background:#f59e0b;color:#111827;border-radius:7px;padding:10px 14px;font-weight:bold}button.secondary{background:#e2e8f0}main{max-width:1200px;margin:25px auto;padding:0 16px}.panel{background:white;padding:20px;border-radius:13px;box-shadow:0 2px 9px #0001;margin-bottom:18px}h2{margin:0 0 15px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:10px;font:inherit}textarea{min-height:44px}label{display:block;font-size:12px;color:#475569}label input,label select{margin-top:5px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0}th{background:#f8fafc}td button{margin-right:5px}#message{padding:10px;display:none;border-radius:8px;margin-bottom:15px;background:#fef3c7}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:#f8fafc;padding:20px;border-radius:10px}.stat strong{display:block;font-size:32px;margin-top:8px}.muted{color:#64748b}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style><style>
:root{--ink:#172033;--accent:#f59e0b;--border:#e2e8f0}body{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;background:#f3f6fb}header{padding:20px clamp(18px,4vw,55px);box-shadow:0 4px 18px #0f172a22}nav{padding:12px clamp(12px,4vw,55px);gap:8px;box-shadow:0 4px 12px #0f172a14}nav button{border-radius:10px;padding:11px 16px;transition:background .2s,transform .2s}nav button:hover{background:#334155;transform:translateY(-1px)}nav button.active:hover{background:var(--accent)}main{max-width:1380px;margin:30px auto;padding:0 clamp(12px,3vw,32px)}.panel{border:1px solid #e8edf4;border-radius:18px;padding:clamp(18px,2.5vw,30px);box-shadow:0 9px 32px #0f172a0b;margin-bottom:22px}h2{font-size:22px;letter-spacing:-.5px}h3{letter-spacing:-.3px}.stat{border:1px solid var(--border);border-radius:15px;background:linear-gradient(145deg,#fff,#f8fafc);padding:24px}.stat strong{font-size:36px;color:#0f172a}button{border-radius:10px;padding:11px 17px;transition:filter .2s,transform .2s}button:hover{filter:brightness(.96);transform:translateY(-1px)}input,select,textarea{border-radius:10px;padding:12px;border-color:#cbd5e1;background:white}input:focus,select:focus,textarea:focus{outline:2px solid #fbbf24;outline-offset:1px}label{font-size:13px;font-weight:600}th{background:#f5f8fc;color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:.04em}td{padding:14px 10px}tr:hover td{background:#fafcff}@media(max-width:650px){header b{font-size:20px}nav{position:sticky;top:0;z-index:5}nav button{font-size:13px;padding:9px 11px}main{margin:16px auto}.panel{padding:16px}form{grid-template-columns:1fr}button{min-height:40px}}
</style><style id="byggapp360-brand-css">.byggapp360-brand{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}.byggapp360-brand img{width:68px;height:68px;object-fit:contain;flex-shrink:0}.byggapp360-brand .byggapp360-word{font-size:23px;font-weight:800;color:#fbbf24;letter-spacing:-.4px}.byggapp360-loginbrand{display:flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:14px}.byggapp360-loginbrand img{width:160px;max-width:100%;height:auto}.byggapp360-loginbrand span{font-weight:800;font-size:24px;color:#fbbf24}@media(max-width:530px){.byggapp360-brand img{width:44px;height:44px}.byggapp360-brand .byggapp360-word{font-size:19px}}</style><style id="byggapp360-full-logo-style">
/* Large full-width logo on dark background. */
.byggapp360-full-logo{display:block;width:520px;max-width:min(100%,calc(100vw - 32px));height:auto;object-fit:contain;flex-shrink:1}
.byggapp360-brand,.byggapp360-loginbrand{display:flex;align-items:center;justify-content:center;margin:0;gap:0;max-width:100%;min-width:0}

@media(max-width:530px){.byggapp360-brand .byggapp360-full-logo{width:350px;max-width:calc(100vw - 32px)}.byggapp360-loginbrand .byggapp360-full-logo{width:450px;max-width:calc(100vw - 32px)}}

</head><body><header><div><div class="byggapp360-brand"><img class="byggapp360-full-logo" src="/assets/byggapp360-logo.png" alt="Byggapp 360" /></div><div id="company">Administration</div></div><button onclick="logout()">Logga ut</button></header><nav id="nav"></nav><main><div id="message"></div><section id="view"></section></main><script>
const tabs=['Översikt','Kunder','Arbetsorder','Offerter','Schema','Jobbrapporter','Personal','Tidrapportering','Löner','Material','Fakturering'];let current='Översikt';let customers=[],projects=[],users=[],times=[],materials=[];
const token=sessionStorage.getItem('byggapp_token');if(!token)location.replace('/login');
function logout(){sessionStorage.removeItem('byggapp_token');location.replace('/login')}
function el(id){return document.getElementById(id)}function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return Number(v||0).toLocaleString('sv-SE',{maximumFractionDigits:2})+' kr'}function date(v){return v?new Date(v).toLocaleString('sv-SE'):'–'}function notice(s){el('message').textContent=s;el('message').style.display='block'}
async function api(url,options={}){const r=await fetch('/api'+url,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...options.headers}});if(r.status===401){logout();throw Error('Sessionen har gått ut')}const d=await r.json();if(!r.ok)throw Error(d.error||'Fel');return d}
async function send(url,method,data){try{await api(url,{method,body:JSON.stringify(data)});notice('Sparat!');await show(current)}catch(e){notice('Fel: '+e.message)}}
const input=(name,placeholder,type='text',value='')=>`<label>${safe(placeholder)}<input name="${name}" type="${type}" value="${safe(value)}" ${type==='number'?'step="any"':''}></label>`;
const select=(name,label,values)=>`<label>${safe(label)}<select name="${name}">${values.map(([v,t])=>`<option value="${safe(v)}">${safe(t)}</option>`).join('')}</select></label>`;
const projectOptions=()=>projects.map(p=>[p.id,p.project_number+' – '+p.title]);const customerOptions=()=>customers.map(c=>[c.id,(c.customer_number||'')+' – '+c.name]);
function formData(f){return Object.fromEntries(new FormData(f).entries())}
function bindForm(formId,url,method='POST'){el(formId).onsubmit=async e=>{e.preventDefault();await send(url,method,formData(e.target))}}
function table(headers,rows){return `<div class="table"><table><thead><tr>${headers.map(h=>'<th>'+safe(h)+'</th>').join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">Inga poster ännu</td></tr>`}</tbody></table></div>`}
function row(cells){return '<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>'}
async function show(tab){if(tab==='Jobbrapporter'){location.href='/jobbrapporter';return}current=tab;el('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${safe(t)}">${safe(t)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));const view=el('view');try{
if(tab==='Översikt'){const x=await api('/overview');view.innerHTML=`<div class="panel"><h2>Översikt</h2><div class="cards">${[['Kunder',x.customers],['Arbetsorder',x.projects],['Användare',x.users],['Aktiva incheckningar',x.active_clocks]].map(([n,v])=>`<div class="stat">${n}<strong>${v}</strong></div>`).join('')}</div></div><p class="muted">Byggapp lokal utvecklingsversion. Kontrollera underlag innan fakturering.</p>`}
if(tab==='Kunder'){customers=await api('/customers');view.innerHTML=`<div class="panel"><h2>Ny kund</h2><form id="f">${input('name','Kundnamn')}${input('phone','Telefon')}${input('email','E-post','email')}${input('address','Adress')}<button>Spara kund</button></form></div><div class="panel"><h2>Kunder</h2>${table(['Kundnummer','Namn','Telefon','E-post','Adress','Åtgärd'],customers.map(c=>row([safe(c.customer_number),safe(c.name),safe(c.phone),safe(c.email),safe(c.address),`<button class="secondary" data-edit="${c.id}">Redigera</button>`])))}</div>`;bindForm('f','/customers');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const c=customers.find(x=>x.id==b.dataset.edit);const name=prompt('Kundnamn',c.name);if(name===null)return;const phone=prompt('Telefon',c.phone||'');if(phone===null)return;const email=prompt('E-post',c.email||'');if(email===null)return;const address=prompt('Adress',c.address||'');if(address===null)return;await send('/customers/'+c.id,'PUT',{name,phone,email,address})})}
if(tab==='Arbetsorder'){[customers,projects]=await Promise.all([api('/customers'),api('/projects')]);view.innerHTML=`<div class="panel"><h2>Ny arbetsorder</h2><form id="f">${select('customer_id','Kund',customerOptions())}${select('category','Arbetstyp',[['service','Service'],['entreprenad','Entreprenad'],['jour','Jour'],['underhall','Underhåll'],['ovrigt','Övrigt']])}${select('title','Arbetsmoment',[['Byte av blandare','Byte av blandare'],['Läckagesökning','Läckagesökning'],['Byte av WC','Byte av WC'],['Rörinstallation','Rörinstallation'],['Radiatorarbete','Radiatorarbete'],['Värmepump / panna','Värmepump / panna'],['Annat arbete','Annat arbete']])}${input('description','Beskrivning')}${select('billing_mode','Debitering',[['hourly','Timpris'],['fixed','Fast pris']])}${input('hourly_price','Timpris kr','number',0)}${input('fixed_price','Fast pris kr','number',0)}${input('min_billable_minutes','Minsta debiterbara minuter','number',120)}${input('vehicle_charge','Servicebil kr','number',0)}${input('discount_percent','Rabatt %','number',0)}<button>Spara arbetsorder</button></form></div><div class="panel"><h2>Arbetsorder</h2>${table(['Nr','Titel','Kund','Status','Ändra status'],projects.map(p=>row([safe(p.project_number),safe(p.title),safe(p.customer_name),safe(p.status),`<select data-status="${p.id}">${['open','ongoing','paused','completed','invoiced'].map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select>`])))}</div>`;el('f').onsubmit=async e=>{e.preventDefault();const b=formData(e.target);b.job_types=[b.category];await send('/projects','POST',b)};document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>send('/projects/'+s.dataset.status,'PATCH',{status:s.value}))}
if(tab==='Personal'){users=await api('/users');view.innerHTML=`<div class="panel"><h2>Ny användare</h2><form id="f">${input('full_name','Förnamn och efternamn')}${input('email','E-post','email')}${input('password','Tillfälligt lösenord (minst 12 tecken)','password')}${select('role','Roll',[['employee','Anställd'],['contractor','Underentreprenör'],['admin','Administratör']])}<button>Skapa användare</button></form></div><div class="panel"><h2>Personal och användare</h2>${table(['Namn','E-post','Roll','Aktiv','Åtgärd'],users.map(u=>row([safe(u.full_name),safe(u.email),safe(u.role),u.active?'Ja':'Nej',`<button class="secondary" data-user="${u.id}" data-active="${u.active}">${u.active?'Inaktivera':'Aktivera'}</button> <button class="secondary" data-name="${u.id}">Ändra namn</button>`])))}</div>`;bindForm('f','/users');document.querySelectorAll('[data-name]').forEach(b=>b.onclick=async()=>{const u=users.find(x=>x.id==b.dataset.name);const full_name=prompt('Anställds namn',u.full_name||'');if(full_name!==null)await send('/users/'+u.id+'/name','PUT',{full_name})});document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>send('/users/'+b.dataset.user,'PATCH',{active:b.dataset.active!=='true'}))}
if(tab==='Schema'){
 [projects,users]=await Promise.all([api('/projects'),api('/users')]);
 const assignments=await api('/assignments');
 const activeUsers=users.filter(u=>u.active&&['employee','contractor'].includes(u.role));
 view.innerHTML=`<div class="panel"><h2>Skicka jobb till anställd</h2><p>Välj arbetsorder, anställd och schematid. Klicka en gång på <b>Skicka jobb</b> så sparas både schema och tilldelning.</p>
 <form id="dispatch">${select('project_id','Arbetsorder',projectOptions())}${select('user_id','Anställd',activeUsers.map(u=>[u.id,u.full_name||u.email]))}
 <label>Starttid<input type="datetime-local" name="start" required></label><label>Sluttid<input type="datetime-local" name="end" required></label>
 <button type="submit" id="dispatchButton">Skicka jobb</button></form><p class="muted">Den anställde hittar jobbet under Schema och öppnar detaljer genom att trycka på arbetsordern.</p></div>
 <div class="panel"><h2>Skickade jobb</h2>${table(['Order','Anställd','Start','Slut','Åtgärd'],assignments.slice().sort((a,b)=>(a.scheduled_start?new Date(a.scheduled_start).getTime():Infinity)-(b.scheduled_start?new Date(b.scheduled_start).getTime():Infinity)).map(a=>row([safe(a.project_number)+' – '+safe(a.title),safe(a.full_name||a.email),date(a.scheduled_start),date(a.scheduled_end),`<button class="secondary" data-unassign="${a.project_id}:${a.user_id}">Ta bort</button>`])))}</div>`;
 el('dispatch').onsubmit=async e=>{
  e.preventDefault();const form=e.target,d=formData(form),btn=el('dispatchButton');
  if(!d.project_id||!d.user_id||!d.start||!d.end||new Date(d.end)<=new Date(d.start)){notice('Kontrollera arbetsorder, person och start-/sluttid');return;}
  btn.disabled=true;btn.textContent='Skickar…';
  try{await api('/jobs/dispatch',{method:'POST',body:JSON.stringify({...d,start:new Date(d.start).toISOString(),end:new Date(d.end).toISOString()})});await show('Schema');notice('Jobbet skickat till den anställdes schema')}
  catch(err){notice('Fel: '+err.message);btn.disabled=false;btn.textContent='Skicka jobb'}
 };
 document.querySelectorAll('[data-unassign]').forEach(b=>b.onclick=()=>{const [p,u]=b.dataset.unassign.split(':');send('/assignments/'+p+'/'+u,'DELETE',{})});
}

if(tab==='Tidrapportering'){[projects,times]=await Promise.all([api('/projects'),api('/time')]);view.innerHTML=`<div class="panel"><h2>Starta arbetstid</h2><form id="f">${select('project_id','Arbetsorder',projectOptions())}${select('work_type','Arbetstyp',[['ordinary','Ordinarie'],['jour','Jour'],['overtime','Övertid']])}<button>Checka in</button></form><p class="muted">Faktisk tid lagras utan avrundning. En aktiv incheckning per användare.</p></div><div class="panel"><h2>Tidrapportering</h2>${table(['Användare','Arbetsorder','Start','Slut','Rast','Åtgärd'],times.map(t=>row([safe(t.user_name||t.user_email),safe(t.project_title),date(t.check_in),date(t.check_out),safe(t.break_minutes)+' min',t.check_out?'–':`<button data-stop="${t.id}">Checka ut</button>`])))}</div>`;bindForm('f','/time/start');document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{const x=prompt('Rast i minuter','0');if(x!==null)send('/time/'+b.dataset.stop+'/stop','POST',{break_minutes:Number(x)})})}
if(tab==='Material'){[projects,materials]=await Promise.all([api('/projects'),api('/materials')]);const catalog=await api('/catalog');view.innerHTML=`<div class="panel"><h2>Lägg till material</h2><form id="f">${select('project_id','Arbetsorder',projectOptions())}${select('catalog_choice','Välj material från katalog',[['','Eget material'],...catalog.map(c=>[c.id,c.name+(c.rsk?' (RSK '+c.rsk+')':'')])])}${input('name','Materialnamn')}${input('rsk','RSK-nummer')}${input('quantity','Antal','number',1)}${input('unit','Enhet','text','st')}${input('purchase_price','Inköpspris kr','number',0)}${input('unit_price','Kundpris kr','number',0)}${input('supplier','Leverantör')}${select('source','Källa',[['vehicle','Servicebil'],['supplier','Leverantör']])}<button>Spara material</button></form><h3>Lägg till i materialkatalog</h3><form id="catalogform">${input('name','Materialnamn')}${input('rsk','RSK-nummer')}${input('unit','Enhet','text','st')}<button>Spara i katalog</button></form></div><div class="panel"><h2>Material</h2>${table(['Arbetsorder','Namn','RSK','Antal','Kundpris','Källa','Åtgärd'],materials.map(m=>row([safe(m.project_title),safe(m.name),safe(m.rsk),safe(m.quantity)+' '+safe(m.unit),money(m.unit_price),safe(m.source),`<button class="secondary" data-delete="${m.id}">Ta bort</button>`])))}</div>`;el('f').querySelector('[name=catalog_choice]').onchange=e=>{const c=catalog.find(c=>String(c.id)===e.target.value);if(c){el('f').elements.name.value=c.name;el('f').elements.rsk.value=c.rsk||'';el('f').elements.unit.value=c.unit||'st'}};bindForm('f','/materials');bindForm('catalogform','/catalog');document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Ta bort materialraden?'))send('/materials/'+b.dataset.delete,'DELETE',{})})}
if(tab==='Löner'){
 const now=new Date();const month=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
 view.innerHTML=`<div class="panel"><h2>Löner och arbetad tid</h2><p><a href='/narvaro'>Öppna daglig närvaro och korrigeringar</a></p><p class="muted">Timmar från den separata dagliga stämpelklockan, inte från projekt. Endast avslutade pass räknas. Jour/OB och övertid behöver kontrolleras och justeras manuellt.</p><form id="paymonth"><label>Månad<input type="month" name="month" value="${month}"></label><button>Visa timmar</button></form><div id="payrows"></div></div><div class="panel"><h2>Sparade timlöner per anställd</h2><p class="muted">Ange kronor per timme för ordinarie tid, jour och övertid. Spara en gång per anställd.</p><div id="rateRows"></div></div><div class="panel"><h2>Lönespecifikation (utkast)</h2><p class="muted">Baserad på avslutade dagliga närvaropass och ordinarie timlön. Jour, OB, övertid, ledighet och semester behöver justeras manuellt. Utkastet måste granskas före användning.</p><form id="payslip"><label>Anställd<select name="user_id" id="payuser"></select></label><label>Månad<input type="month" name="month" value="${month}"></label>${input('tax_deduction','Skatteavdrag kr','number',0)}${input('other_adjustment','Övrig justering kr','number',0)}<button type="submit">Skapa PDF-utkast</button><button type="button" id="sendPayslip" class="secondary">Skicka utkast via e-post</button></form></div>`;
 const rateList=await api('/payroll/rates');
 el('rateRows').innerHTML=rateList.map(r=>`<form class="rateForm" data-user="${r.id}" style="padding:14px 0;border-bottom:1px solid #dbe3ec"><strong>${safe(r.full_name||r.email)}</strong><div class="grid">${input('ordinary_rate','Ordinarie kr/tim','number',r.ordinary_rate)}${input('jour_rate','Jour kr/tim','number',r.jour_rate)}${input('overtime_rate','Övertid kr/tim','number',r.overtime_rate)}</div><button>Spara ersättningar</button></form>`).join('');
 document.querySelectorAll('.rateForm').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{await api('/payroll/rates/'+f.dataset.user,{method:'PUT',body:JSON.stringify(formData(f))});notice('Löneersättningar sparade')}catch(err){notice('Fel: '+err.message)}});
 const render=async m=>{const rows=await api('/payroll/summary?month='+encodeURIComponent(m));const map=new Map();for(const r of rows){const k=r.id;if(!map.has(k))map.set(k,{...r,total:0,types:{}});const x=map.get(k);x.total+=Number(r.minutes);x.types[r.work_type||'ordinary']=(x.types[r.work_type||'ordinary']||0)+Number(r.minutes)}const list=[...map.values()];el('payuser').innerHTML=list.map(x=>`<option value="${x.id}">${safe(x.full_name||x.email)}</option>`).join('');el('payrows').innerHTML=table(['Anställd','Ordinarie närvaro','Jour*','Övertid*','Totalt'],list.map(x=>row([safe(x.full_name||x.email),...['ordinary','jour','overtime'].map(t=>(Number(x.types[t]||0)/60).toFixed(2)+' h'),'<b>'+(x.total/60).toFixed(2)+' h</b>'])))};
 el('paymonth').onsubmit=async e=>{e.preventDefault();try{await render(e.target.elements.month.value)}catch(err){notice(err.message)}};await render(month);
 el('sendPayslip').onclick=async()=>{if(!confirm('Skicka ett UTKAST till den anställdes e-post? Kontrollera belopp, skatt och tillägg först.'))return;try{const data={...formData(el('payslip')),send:true,confirm:true};const result=await api('/payroll/payslip',{method:'POST',body:JSON.stringify(data)});notice('Utkast skickat till '+result.recipient)}catch(err){notice('Fel: '+err.message)}};
 el('payslip').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/payroll/payslip',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(formData(e.target))});if(!r.ok){const j=await r.json();throw Error(j.error||'PDF-fel')}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lonespecifikation-utkast.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(err){notice(err.message)}};
}
if(tab==='Offerter'){
  [customers,projects]=await Promise.all([api('/customers'),api('/projects')]);
  const offers=await api('/quotes');
  view.innerHTML=`<div class="panel"><h2>Skapa offert</h2><p class="muted">Offerten skapas för en befintlig arbetsorder. Arbete och material anges separat. ROT väljs först vid fakturering.</p><form id="offerform">${select('project_id','Arbetsorder',projectOptions())}<label>Beskrivning<textarea name="description" rows="3"></textarea></label>${input('labor_amount','Arbete exkl. moms (kr)','number',0)}${input('other_amount','Övrigt/servicebil exkl. moms (kr)','number',0)}${input('discount_percent','Rabatt %','number',0)}<div style="grid-column:1/-1"><h3>Materialrader</h3><div id="offerMaterials"></div><button class="secondary" type="button" id="addOfferRow">+ Materialrad</button></div><button type="submit">Skapa offertutkast</button></form></div>
  <div class="panel"><h2>Offerter</h2>${table(['Offert','Arbetsorder','Kund','Status','Belopp inkl. moms','Åtgärd'],offers.map(o=>{const mats=(o.material_rows||[]).reduce((s,m)=>s+Number(m.quantity)*Number(m.unit_price),0);const total=(Number(o.labor_amount)+mats+Number(o.other_amount))*(1-Number(o.discount_percent)/100)*(1+Number(o.vat_rate)/100);return row([safe('O-'+o.id),safe(o.project_number)+' – '+safe(o.title),safe(o.customer_name),safe(({draft:'Utkast',sent:'Skickad',accepted:'Accepterad',rejected:'Nekad'})[o.status]),money(total),`<button class="secondary" data-offer-pdf="${o.id}">PDF</button> ${o.status==='draft'||o.status==='sent'?`<button data-offer-send="${o.id}">Skicka e-post</button>`:''} ${o.status==='sent'?`<button data-offer-accept="${o.id}">Accepterad</button><button class="secondary" data-offer-reject="${o.id}">Nekad</button>`:''}`])}))}</div>`;
  const mat=el('offerMaterials');const add=()=>{const row=document.createElement('div');row.style.cssText='display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:7px;margin-bottom:8px';row.innerHTML='<input placeholder="Material" class="matName" maxlength="250"><input placeholder="Antal" type="number" min="0.01" step="any" value="1" class="matQty"><input placeholder="Enhet" class="matUnit" value="st"><input placeholder="Pris/st exkl moms" type="number" min="0" step="any" class="matPrice" value="0"><button type="button" class="secondary">Ta bort</button>';row.querySelector('button').onclick=()=>row.remove();mat.append(row)};
  el('addOfferRow').onclick=add;add();
  el('offerform').onsubmit=async e=>{e.preventDefault();try{const f=formData(e.target);const material_rows=[...mat.children].filter(r=>r.querySelector('.matName').value.trim()).map(r=>({name:r.querySelector('.matName').value,quantity:r.querySelector('.matQty').value,unit:r.querySelector('.matUnit').value,unit_price:r.querySelector('.matPrice').value}));await api('/quotes',{method:'POST',body:JSON.stringify({...f,material_rows})});await show('Offerter');notice('Offertutkast skapat')}catch(err){notice('Fel: '+err.message)}};
  async function pdf(offerId){const r=await fetch('/api/quotes/'+offerId+'/pdf',{headers:{Authorization:'Bearer '+token}});if(!r.ok){const j=await r.json();throw Error(j.error||'PDF-fel')}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='offert-'+offerId+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
  document.querySelectorAll('[data-offer-pdf]').forEach(b=>b.onclick=async()=>{try{await pdf(b.dataset.offerPdf)}catch(e){notice('Fel: '+e.message)}});
  document.querySelectorAll('[data-offer-send]').forEach(b=>b.onclick=async()=>{if(!confirm('Skicka offerten via e-post till kunden?'))return;try{const x=await api('/quotes/'+b.dataset.offerSend+'/send',{method:'POST',body:JSON.stringify({confirm:true})});await show('Offerter');notice('Offert skickad till '+x.recipient)}catch(e){notice('Fel: '+e.message)}});
  for(const [attribute,status] of [['data-offer-accept','accepted'],['data-offer-reject','rejected']])document.querySelectorAll('['+attribute+']').forEach(b=>b.onclick=async()=>{if(!confirm('Registrera offerten som '+(status==='accepted'?'accepterad':'nekad')+'?'))return;try{await api('/quotes/'+b.getAttribute(attribute)+'/decision',{method:'POST',body:JSON.stringify({status})});await show('Offerter');notice('Offertstatus uppdaterad')}catch(e){notice('Fel: '+e.message)}});
 }
if(tab==='Fakturering'){
 projects=await api('/projects');const drafts=await api('/invoices/drafts');const cfg=await api('/invoices/settings');
 view.innerHTML=`<div class="panel"><h2>Företagets fakturauppgifter</h2><p>Logotyp läggs automatiskt på fakturan när den har laddats upp. Kontrollera alla uppgifter före utskick.</p><form id="cfg">${input('org_number','Organisationsnummer','text',cfg.org_number)}${input('street_address','Gatuadress','text',cfg.street_address)}${input('postal_address','Postnummer och ort','text',cfg.postal_address)}${input('phone','Telefon','text',cfg.phone)}${input('email','Företagets e-post','email',cfg.email)}${input('bankgiro','Bankgiro','text',cfg.bankgiro)}${input('payment_terms','Betalningsvillkor (dagar)','number',cfg.payment_terms)}${input('vat_percent','Moms %','number',cfg.vat_percent)}<label>Företagslogotyp (PNG eller JPG, max 150 kB)<input id="logo" type="file" accept="image/png,image/jpeg"></label><button>Spara fakturauppgifter</button></form><small>${cfg.has_logo?'Logotyp finns sparad':'Ingen logotyp sparad ännu'}</small></div>
 <div class="panel"><h2>Skapa faktura</h2><p>Accepterad offert används automatiskt som fakturaunderlag. Granska underlaget och spara ett fakturautkast. Fakturan skickas bara när du uttryckligen klickar på Skicka.</p><form id="f">${select('project_id','Arbetsorder',projectOptions())}<label><input type='checkbox' name='rot' value='true' style='width:auto'> ROT-avdrag (30 % av godkänd arbetskostnad inkl. moms)</label><div style="grid-column:1/-1"><p class="muted">Vid ROT måste du ange uppgifterna nedan innan du skapar fakturautkast.</p><label>Kundens personnummer (ÅÅÅÅMMDDXXXX)<input name="rot_personnummer" placeholder="12 siffror" maxlength="12" autocomplete="off"></label><label>Fastighetsbeteckning eller BRF organisationsnummer<input name="rot_property" maxlength="150"></label><label>Lägenhetsnummer (vid bostadsrätt)<input name="rot_apartment" maxlength="100"></label></div><button>Förhandsgranska</button></form><div id="preview"></div></div>
 <div class="panel"><h2>Fakturor</h2>${table(['Fakturanummer','Projekt','Belopp exkl. moms','Status','Åtgärder'],drafts.map(d=>row([safe(d.invoice_number||d.id),safe(d.project_number)+' – '+safe(d.title),money(d.total),safe(d.status),`<button class="secondary" data-pdf="${d.id}">Hämta PDF</button> ${d.status==='sent'?'Skickad':`<button data-send="${d.id}">Skicka till kund</button>`}`])))}</div>`;
 el('cfg').onsubmit=async e=>{e.preventDefault();const values=formData(e.target);const file=el('logo').files[0];if(file){if(file.size>150000||!['image/png','image/jpeg'].includes(file.type)){notice('Logotypen måste vara PNG/JPG, max 150 kB');return}values.logo_data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}await send('/invoices/settings','PUT',values)};
 el('f').onsubmit=async e=>{e.preventDefault();try{const pid=formData(e.target).project_id;const withRot=!!e.target.querySelector('[name=rot]')?.checked;const d=await api('/invoices/preview/'+pid+'?rot='+withRot);el('preview').innerHTML=`<h3>${safe(d.project.title)}</h3><p>Faktisk tid: ${d.actualMinutes} min (ej avrundad)</p><p>Debiterbar tid: ${d.billableMinutes} min</p><p>Arbete: ${money(d.labor)} | Material: ${money(d.materialTotal)} | Servicebil: ${money(d.vehicleCharge)}</p><p>Rabatt: ${money(d.discount)} | Preliminär ROT: ${money(d.rotDeduction)}</p><h2>Totalt exklusive moms: ${money(d.total)}</h2><p>Beräknat att betala inklusive moms och eventuellt ROT: ${money(d.total*(1+d.vatRate/100)-d.rotDeduction)}</p><p class="muted">${safe(d.warning)} Kontrollera moms, ROT, fakturanummer, betalningsuppgifter och lagkrav före utskick.</p><button id="saveDraft">Skapa fakturautkast</button>`;el('saveDraft').onclick=()=>{const fields=formData(el('f'));send('/invoices/drafts/'+pid,'POST',{rot:withRot,rot_personnummer:fields.rot_personnummer,rot_property:fields.rot_property,rot_apartment:fields.rot_apartment})}}catch(err){notice(err.message)}};
 document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=async()=>{try{const r=await fetch('/api/invoices/drafts/'+b.dataset.pdf+'/pdf',{headers:{Authorization:'Bearer '+token}});if(!r.ok){const x=await r.json();throw Error(x.error||'PDF-fel')}const blob=await r.blob();const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='faktura-'+b.dataset.pdf+'.pdf';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){notice(e.message)}});
 document.querySelectorAll('[data-send]').forEach(b=>b.onclick=async()=>{if(!confirm('Vill du skicka fakturan till kundens registrerade e-postadress? Kontrollera först PDF och belopp.'))return;await send('/invoices/drafts/'+b.dataset.send+'/send','POST',{confirm:true})});
}

<script>
/* admin-material-monthly */
(() => {
 'use strict';
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const auth=()=>sessionStorage.getItem('byggapp_token');
 const api=async(url,opt={})=>{const r=await fetch('/api'+url,{...opt,headers:{Authorization:'Bearer '+auth(),'Content-Type':'application/json',...(opt.headers||{})}});const data=await r.json();if(!r.ok)throw Error(data.error||'Kunde inte spara');return data};
 let busy=false,attached=null;
 function panel(){
  const view=document.getElementById('view');
  if(!view||!view.textContent.includes('Lägg till material'))return;
  if(attached===view.querySelector('form')&&document.getElementById('adminMaterialEditor'))return;
  const form=view.querySelector('form');if(!form)return;
  attached=form;
  const section=document.createElement('section');section.className='panel';section.id='adminMaterialEditor';
  section.innerHTML='<h2>Ändra befintligt material</h2><p>Admin kan ändra materialnamn, antal, enhet, RSK, leverantör och priser. Lägg till nytt material i formuläret ovan.</p><div id="editMaterialNotice" role="status"></div><div id="editMaterialRows">Hämtar…</div>';
  view.appendChild(section);load();
 }
 async function load(){
  const host=document.getElementById('editMaterialRows');if(!host||busy)return;
  try{
   const rows=await api('/materials');if(!document.contains(host))return;
   host.innerHTML=rows.length?rows.map(m=>`<form class="material-edit-line" data-id="${Number(m.id)}" style="border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">
     <div style="grid-column:1/-1"><b>${esc(m.project_title||'Arbetsorder')}</b></div>
     <label>Material<input name="name" required maxlength="250" value="${esc(m.name)}"></label>
     <label>Antal<input name="quantity" type="number" step="0.01" min="0.01" required value="${Number(m.quantity)}"></label>
     <label>Enhet<input name="unit" maxlength="20" value="${esc(m.unit||'st')}"></label>
     <label>RSK<input name="rsk" maxlength="100" value="${esc(m.rsk||'')}"></label>
     <label>Leverantör<input name="supplier" maxlength="150" value="${esc(m.supplier||'')}"></label>
     <label>Kundpris/st<input name="unit_price" type="number" min="0" step="0.01" value="${Number(m.unit_price)||0}"></label>
     <label>Inköpspris/st<input name="purchase_price" type="number" min="0" step="0.01" value="${Number(m.purchase_price)||0}"></label>
     <button type="submit">Spara ändring</button>
   </form>`).join(''):'Inget material registrerat än.';
   host.querySelectorAll('form').forEach(f=>f.addEventListener('submit',async e=>{
    e.preventDefault();if(busy)return;busy=true;
    const b=Object.fromEntries(new FormData(f));
    try{await api('/materials/'+f.dataset.id+'/edit',{method:'PUT',body:JSON.stringify(b)});document.getElementById('editMaterialNotice').textContent='Material uppdaterat. Granska materialpriserna igen före fakturering.';}
    catch(err){document.getElementById('editMaterialNotice').textContent='Fel: '+err.message}
    finally{busy=false}
   }));
  }catch(e){host.textContent=e.message}
 }
 new MutationObserver(()=>panel()).observe(document.body,{childList:true,subtree:true});
 panel();
})();

</script>
